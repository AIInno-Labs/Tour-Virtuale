<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1f2d">
  <title>Cala dei Balcani - Virtual tour</title>
  <meta name="description" content="Walk through Cala dei Balcani in 360 degrees: the pine grove, the stone tower, the halls and the terraces above the sea.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preload" href="assets/fonts/bodoni-moda-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=40">
</head>
<body>
  <div id="pano" aria-label="360 degree panorama"></div>
  <canvas id="trailCanvas" aria-hidden="true"></canvas>
  <div id="progress" hidden></div>
  <div id="crosshair" hidden></div>

  <header id="top">
    <div id="topLeft" class="dock">
      <button id="brand" type="button" aria-label="Welcome screen" data-i18n-label="welcomeScreen">
        <img src="assets/emblem.png" alt="" width="38" height="38">
        <span><b id="brandName"></b><small id="brandTag"></small></span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btnBack" class="dock-btn" type="button"><i></i><span data-i18n="back">Back</span></button>
      <button id="btnAreas" class="dock-btn" type="button" aria-expanded="false" aria-controls="areas"><i></i><span data-i18n="areas">Areas</span></button>
    </div>

    <div id="topRight">
      <nav id="tools" aria-label="Tour tools">
        <button id="btnMap" class="tool" type="button" hidden><i></i><span data-i18n="plan">Plan</span></button>
        <button id="btnPhotos" class="tool icon" type="button" data-tip="Gallery" aria-label="Gallery" data-i18n-tip="gallery" hidden><i></i></button>
        <button id="btnRotate" class="tool icon" type="button" data-tip="Auto-rotate" aria-label="Auto-rotate" aria-pressed="true"><i></i></button>
        <button id="btnFull" class="tool icon" type="button" data-tip="Fullscreen" aria-label="Fullscreen" data-i18n-tip="fullscreen"><i></i></button>
        <button id="btnMode" class="tool icon" type="button" data-tip="Night" aria-label="Night"><i></i></button>
      <button id="btnLang" class="tool lang" type="button" data-i18n-tip="language" aria-label="Language" aria-expanded="false" aria-controls="langMenu">IT</button>
      </nav>
      <a id="btnWebsite" class="tool primary" href="#" target="_blank" rel="noopener" data-tip="Go to website" data-i18n-tip="goWebsite"><i></i><span data-i18n="website">Website</span></a>
      <button id="btnInquire" class="tool primary" type="button" data-tip="Call or email us" data-i18n-tip="inquireTip" aria-expanded="false" aria-controls="inquire"><i></i><span data-i18n="inquire">Inquire</span></button>
      <button id="btnMenu" class="tool" type="button" aria-expanded="false" aria-controls="menu"><span data-i18n="menu">Menu</span><i></i></button>
    </div>
  </header>

  <section id="scene" aria-live="polite">
    <p id="sceneChapter"></p>
    <h1 id="sceneName"></h1>
    <div id="stepper">
      <button id="btnPrev" type="button"><i></i><span data-i18n="previous">Previous</span></button>
      <button id="btnNext" type="button"><span data-i18n="next">Next</span><i></i></button>
    </div>
  </section>

  <div id="pan" role="group" aria-label="Look left or right" data-i18n-label="lookLR">
    <button id="panL" type="button" aria-label="Look left" data-i18n-label="lookLeft"><i></i></button>
    <span class="pan-label">360&deg;</span>
    <button id="panR" type="button" aria-label="Look right" data-i18n-label="lookRight"><i></i></button>
  </div>

  <div id="nav">
    <div id="zoom" role="group" aria-label="Zoom">
      <button id="zOut" type="button" aria-label="Zoom out" data-i18n-label="zoomOut">&minus;</button>
      <button id="zIn" type="button" aria-label="Zoom in" data-i18n-label="zoomIn">+</button>
    </div>
  </div>

  <aside id="areas" class="panel" aria-hidden="true" aria-label="Areas" data-i18n-label="areas">
    <header>
      <div class="panel-brand">
        <img src="assets/emblem.png" alt="" width="38" height="38">
        <span id="areasBrandName"></span>
      </div>
      <button class="close" type="button" data-close="areas" aria-label="Close areas" data-i18n-label="close">&times;</button>
    </header>
    <div id="areasBody"></div>
  </aside>

  <aside id="plan" class="panel panel-wide" aria-hidden="true" aria-label="Plan" data-i18n-label="plan">
    <header>
      <h2 data-i18n="plan">Plan</h2>
      <button class="close" type="button" data-close="plan" aria-label="Close plan" data-i18n-label="close">&times;</button>
    </header>
    <div id="planWrap"><img id="planImg" alt="Floor plan"></div>
  </aside>

  <div id="inquire" class="pop" role="dialog" aria-label="Inquire" aria-hidden="true">
    <button class="close" type="button" data-close="inquire" aria-label="Close" data-i18n-label="close">&times;</button>
    <p class="pop-kicker" data-i18n="inqKicker">Inquire</p>
    <h2 data-i18n="inqTitle">Talk to our team</h2>
    <a id="inqPhone" class="pop-phone" href="#"></a>
    <div class="pop-actions">
      <a id="inqCall" class="cta small" href="#" data-i18n="callNow">Call now</a>
      <a id="inqMail" class="ghost small" href="#" data-i18n="sendEmail">Send an email</a>
    </div>
  </div>

  <div id="langMenu" class="pop pop-lang" role="dialog" aria-label="Language" aria-hidden="true">
    <button class="close" type="button" data-close="langMenu" aria-label="Close" data-i18n-label="close">&times;</button>
    <p class="pop-kicker" data-i18n="language">Language</p>
    <div id="langList" class="lang-list">
      <button class="lang-row" type="button" data-lang="it" aria-pressed="true"><span class="lang-code">IT</span><span class="lang-name">Italiano</span></button>
      <button class="lang-row" type="button" data-lang="en" aria-pressed="false"><span class="lang-code">EN</span><span class="lang-name">English</span></button>
      <button class="lang-row" type="button" data-lang="fr" aria-pressed="false"><span class="lang-code">FR</span><span class="lang-name">Français</span></button>
      <button class="lang-row" type="button" data-lang="es" aria-pressed="false"><span class="lang-code">ES</span><span class="lang-name">Español</span></button>
      <button class="lang-row" type="button" data-lang="de" aria-pressed="false"><span class="lang-code">DE</span><span class="lang-name">Deutsch</span></button>
    </div>
  </div>

  <aside id="menu" class="panel panel-right" aria-hidden="true" aria-label="Menu">
    <header>
      <h2 data-i18n="menu">Menu</h2>
      <button class="close" type="button" data-close="menu" aria-label="Close menu" data-i18n-label="close">&times;</button>
    </header>
    <nav id="menuList">
      <button class="mi" type="button" data-act="welcome"><span class="ico"><i></i></span><span class="lbl" data-i18n="miWelcome">Home</span><i class="chev"></i></button>
      <button class="mi" type="button" data-act="start"><span class="ico"><i></i></span><span class="lbl" data-i18n="miStart">Start the tour</span><i class="chev"></i></button>
      <button class="mi" type="button" data-act="areas"><span class="ico"><i></i></span><span class="lbl" data-i18n="miAreas">All places</span><i class="chev"></i></button>
      <button class="mi" type="button" data-act="galleries" aria-expanded="false"><span class="ico"><i></i></span><span class="lbl" data-i18n="miGalleries">Gallery</span><i class="chev"></i></button>
      <div id="miGalList" class="mi-sub" hidden></div>
      <button class="mi" type="button" data-act="aerial"><span class="ico"><i></i></span><span class="lbl" data-i18n="miAerial">Aerial view</span><i class="chev"></i></button>
      <button class="mi" type="button" data-act="plan" hidden><span class="ico"><i></i></span><span class="lbl" data-i18n="miPlan">Floor plan</span><i class="chev"></i></button>
      <button class="mi" type="button" data-act="share"><span class="ico"><i></i></span><span class="lbl" data-i18n="miShare">Share</span><i class="chev"></i></button>
    </nav>
    <div class="menu-mode" role="group" aria-label="Day or night" data-i18n-label="dayNight">
      <button id="mDay" type="button" aria-pressed="false" data-mode="day"><i></i><span data-i18n="day">Day</span></button>
      <button id="mNight" type="button" aria-pressed="false" data-mode="night"><i></i><span data-i18n="night">Night</span></button>
    </div>
    <footer class="menu-contact">
      <span class="menu-kicker" data-i18n="inqKicker">Inquire</span>
      <a id="menuEmail" class="menu-row" href="#"><span class="ico"><i></i></span><span class="menu-email"></span></a>
      <a id="menuPhone" class="menu-row" href="#"><span class="ico"><i></i></span><span class="menu-phone"></span></a>
    </footer>
  </aside>

  <section id="intro" hidden>
    <div class="intro-inner">
      <img class="intro-logo" src="assets/logo.png" alt="Cala dei Balcani" width="220" height="220">
      <p class="intro-eyebrow" data-i18n="eyebrow">A 360&deg; walk</p>
      <p id="introLead"></p>
      <div class="intro-actions">
        <button id="introStart" class="cta big" type="button"><span class="lbl"></span><span class="disc"><i></i></span></button>
      </div>
      <p id="introHint" class="intro-hint"></p>
    </div>
  </section>

  <div id="toast" hidden></div>

  <div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photos">
    <header>
      <p><span id="lbTitle"></span><span id="lbCount"></span></p>
      <button id="lbClose" type="button" aria-label="Close photos" data-i18n-label="closePhotos">&times;</button>
    </header>
    <div id="galGrid" class="bento"></div>
    <div id="lbStage" hidden>
      <button id="lbPrev" type="button" aria-label="Previous photo" data-i18n-label="prevPhoto"><i></i></button>
      <img id="lbImg" alt="">
      <button id="lbNext" type="button" aria-label="Next photo" data-i18n-label="nextPhoto"><i></i></button>
    </div>
    <div id="lbStrip" hidden></div>
  </div>

  <script src="vendor/marzipano.js"></script>
  <script src="js/i18n.js?v=40"></script>
  <script src="js/scenes.js?v=40"></script>
  <script src="js/app.js?v=40"></script>
</body>
</html>
